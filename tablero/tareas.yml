# =============================================================================
# TABLERO DE AMATISTA: roadmap (versiones) y tareas (Kanban)
#
# Este archivo lo editan las personas: aquí se crean tareas y se planean
# versiones. El estado de cada tarea lo calculan los commits (ver
# tablero/README.md) y el resultado se publica en KANBAN.md.
#
# estado (opcional): estado mínimo puesto a mano (pendiente, en-progreso,
# revision, hecho). Los commits solo pueden hacer avanzar una tarea.
# =============================================================================

roadmap:
  - version: v2.1.0
