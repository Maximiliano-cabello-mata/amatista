# =============================================================================
# TABLERO DE AMATISTA: roadmap (versiones) y tareas (Kanban)
#
# Este archivo lo editan las personas: aquí se crean tareas y se planean
# versiones. El estado de cada tarea lo calculan los commits (ver
# tablero/README.md) y el resultado se publica en KANBAN.md.
#
# estado (opcional): estado mínimo puesto a mano (pendiente, en-progreso,
# revision, hecho). Los commits solo pueden hacer avanzar una tarea.
#
# Campos opcionales (no cambian el estado; se leen aquí): resultado,
# depende_de, aceptacion, evidencia y bloqueo (ver tablero/README.md).
#
# Tablero de la etapa v3 «Reestructuración» (desde el 3 de octubre de 2026).
# El tablero de la v2 quedó tal cual en tablero/historico/. Plan completo:
# docs/reestructuracion/00_plan_maestro.md
# =============================================================================

etapa:
  nombre: Reestructuración
  desde: "2026-10-03"
  plan: docs/reestructuracion/00_plan_maestro.md
  historico: tablero/historico/2026-10-03_v2_KANBAN.md
  # Tareas cerradas en la v2 (están en el histórico). Se listan para que los
  # commits viejos que las mencionan no aparezcan como «tareas desconocidas».
  archivadas: [T-001, T-007, T-018, T-020]

roadmap:
  - version: v2.2.0
    nombre: Piloto
    objetivo: Cerrar la v2.2 y abrir el piloto del 8 de octubre sin ampliar el alcance (servicio, HTTPS, SMTP, pruebas y seguridad).
  - version: v3.0.0
    nombre: Reestructuración
    objetivo: Niveles, habilidades, versiones de Blender y herramientas de autor en Oracle; documentación y tablero nuevos.
  - version: v3.1.0
    nombre: Mi primer espacio 3D
    objetivo: Primera entrega de contenido por niveles (lecciones 01–11 de la propuesta) con fichas, rúbrica y versión verificada.
  - version: v3.2.0
    nombre: Laboratorio 3D
    objetivo: Visor GLB en las lecciones, escena de ejemplo y lección 12 (exportar y comprobar).
  - version: v3.3.0
    nombre: Add-on de Blender
    objetivo: Add-on conectado a la plataforma (vincular cuenta, panel de lección, comprobaciones y verificaciones).
  - version: v3.4.0
    nombre: Especialidades y tutor
    objetivo: Primera rama del nivel 5 y tutor IA dentro de las lecciones.

