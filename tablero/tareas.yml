# =============================================================================
# TABLERO DE AMATISTA: roadmap (versiones) y tareas (Kanban)
#
# Este archivo lo editan las personas: aquí se crean tareas y se planean
# versiones. El estado de cada tarea lo calculan los commits (ver
# tablero/README.md) y el resultado se publica en KANBAN.md.
#
# estado (opcional): estado mínimo puesto a mano (pendiente, en-progreso,
# revision, hecho). Los commits solo pueden hacer avanzar una tarea.
#
# Campos opcionales (no cambian el estado; se leen aquí): resultado,
# depende_de, aceptacion, evidencia y bloqueo (ver tablero/README.md).
# =============================================================================

roadmap:
  - version: v2.1.0
    nombre: Oracle en producción
    objetivo: El progreso de los alumnos se guarda en Oracle desde el servidor.
  - version: v2.2.0
    nombre: Plataforma unificada
    objetivo: Cuentas con roles, panel del alumno, panel de administración, contenido administrable, lecciones interactivas y lanzamiento de la beta.
  - version: v2.3.0
    nombre: Módulo 2
    objetivo: Segundo módulo de Blender y de A-Frame.
  - version: v3.0.0
    nombre: Amatista 3D Lab
    objetivo: Modelos GLB, tutor IA y puente con Blender (ver docs/propuestas).

