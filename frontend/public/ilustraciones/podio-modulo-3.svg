<text x="765" y="365" font-size="17">Suelo: Z = 0</text><text x="50" y="480" font-size="16" fill="#d4c8eb">Los puntos marcan los orígenes centrales. Y = 0 en las tres piezas. Separación entre piezas: 0.1.</text></g></svg>