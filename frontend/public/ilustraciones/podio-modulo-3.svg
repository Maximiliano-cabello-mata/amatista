<title id="title">Podio: medidas de referencia, vista frontal</title><desc id="desc">Tres bloques de ancho y profundidad uno. De izquierda a derecha: alturas uno, uno y medio y medio; centros X menos uno punto uno, cero y uno punto uno. Todos apoyan en Z cero.</desc>
