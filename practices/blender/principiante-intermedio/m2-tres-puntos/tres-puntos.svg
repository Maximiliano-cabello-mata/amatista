<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="sans-serif" font-size="13">
  <title>Iluminación de tres puntos vista desde arriba</title>
  <rect width="320" height="240" rx="12" fill="#1f1b2e"/>
  <circle cx="160" cy="110" r="26" fill="#9b7fd4"/>
  <text x="160" y="114" fill="#fff" text-anchor="middle">Modelo</text>
  <rect x="145" y="196" width="30" height="20" rx="3" fill="#e8e8e8"/>
  <text x="160" y="232" fill="#e8e8e8" text-anchor="middle">Cámara</text>
  <circle cx="70" cy="170" r="14" fill="#ffd166"/>
  <text x="70" y="200" fill="#ffd166" text-anchor="middle">Principal</text>
  <circle cx="250" cy="170" r="10" fill="#ffd166" opacity="0.55"/>
  <text x="250" y="200" fill="#ffd166" text-anchor="middle" opacity="0.8">Relleno</text>
  <circle cx="160" cy="30" r="12" fill="#7fd6ff"/>
  <text x="200" y="34" fill="#7fd6ff">Contraluz</text>
  <g stroke-width="2" stroke-dasharray="4 4" fill="none">
    <line x1="80" y1="160" x2="138" y2="124" stroke="#ffd166"/>
    <line x1="242" y1="162" x2="182" y2="124" stroke="#ffd166" opacity="0.55"/>
    <line x1="160" y1="42" x2="160" y2="84" stroke="#7fd6ff"/>
  </g>
</svg>
