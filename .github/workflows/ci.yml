# CI (T-007): revisa cada push y cada pull request.
# - backend: pytest, validación de los módulos JSON, tablero, motor y constructor del add-on.
# - addon-blender: el add-on dentro de Blender (bpy de PyPI).
# - frontend: lint, pruebas (vitest) y build de producción.
# Los commits del bot del tablero solo tocan KANBAN.md: no disparan CI.
name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['KANBAN.md']
  pull_request:
    paths-ignore: ['KANBAN.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Pruebas con SQLite temporal (tests/conftest.py); nunca Oracle real.
      AMATISTA_SIN_LIMITES: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt pyyaml

      - name: Pruebas del backend
        run: python -m pytest -q

      - name: Validar los módulos de contenido
        run: python herramientas/contenido.py validar

      - name: Pruebas del tablero
        working-directory: .
        run: python -m pytest -q tablero

      - name: Pruebas del motor y del constructor del add-on
        working-directory: .
        run: python -m pytest -q engine/tests addon/tests

  addon-blender:
    # El add-on dentro de Blender de verdad (módulo bpy de PyPI, sin ventana):
    # registro, prácticas del tren y la espada, «Ver el ejemplo», modo Author y paneles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bibliotecas que bpy necesita en Linux
        run: sudo apt-get update && sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1

      - name: Instalar bpy (Blender 5.0 como módulo de Python)
        run: pip install bpy==5.0.1

      - name: Add-on dentro de Blender
        run: python addon/tests/en_blender.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build de producción
        run: npm run build
